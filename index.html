<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #070b12;
    --surface: #0d131c;
    --surface-2: #151d29;
    --text: #f5f7fb;
    --muted: #9aa7b8;
    --border: #253044;
    --accent: #5b8cff;
    --accent-hover: #79a2ff;
    --accent-soft: rgba(91,140,255,.14);
    --success: #4ade80;
    --success-soft: rgba(74,222,128,.12);
    --shadow: 0 18px 45px rgba(0,0,0,.35);
    --radius: 16px;
    --max-width: 1280px;
}




/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;

    transition:
        background .2s ease,
        color .2s ease;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    text-decoration: none;
    color: inherit;
}

img {
    display: block;
    width: 100%;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: min(
        calc(100% - 48px),
        var(--max-width)
    );

    margin: auto;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 999;

    border-bottom: 1px solid var(--border);

    background: rgba(7,11,18,.92);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}


.nav-inner {
    min-height: 72px;

    max-width: var(--max-width);
    margin: auto;

    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;

    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.4px;
}

.brand-mark {
    width: 38px;
    height: 34px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background: var(--accent);
    color: white;

    font-size: 14px;
    font-weight: 800;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-link {
    padding: 9px 12px;

    border-radius: 8px;

    color: var(--muted);

    font-size: 13px;
    font-weight: 600;

    transition: .2s;
}

.nav-link:hover {
    color: var(--text);
    background: var(--surface-2);
}

.theme-btn {
    width: 38px;
    height: 38px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--surface);
    color: var(--text);

    display: grid;
    place-items: center;

    font-size: 16px;

    transition: .2s;
}

.theme-btn:hover {
    background: var(--surface-2);
}


/* =========================================================
   HERO
========================================================= */

.hero {
    padding: 28px 0 10px;
}

.hero-content {
    max-width: 850px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 6px 10px;

    margin-bottom: 18px;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: var(--surface);

    color: var(--muted);

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .6px;
}

.eyebrow-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--accent);
}

.hero h1 {
    font-size: clamp(38px,5vw,64px);

    line-height: 1.04;

    letter-spacing: -3px;

    margin-bottom: 18px;
}

.hero h1 span {
    color: var(--accent);
}

.hero-description {
    max-width: 700px;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.75;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    margin: 25px 0 34px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    flex-wrap: wrap;
}

.search-box {
    position: relative;

    flex: 1;

    min-width: 240px;
    max-width: 420px;
}

.search-box input {
    width: 100%;
    height: 46px;

    padding: 0 15px 0 42px;

    border: 1px solid var(--border);
    border-radius: 10px;

    outline: none;

    background: var(--surface);
    color: var(--text);

    font-size: 13px;

    transition: .2s;
}

.search-box input:focus {
    border-color: var(--accent);

    box-shadow:
        0 0 0 3px var(--accent-soft);
}

.search-icon {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: var(--muted);
}

.filters {
    display: flex;
    gap: 7px;

    overflow-x: auto;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-btn {
    white-space: nowrap;

    padding: 9px 13px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--surface);
    color: var(--muted);

    font-size: 12px;
    font-weight: 600;

    transition: .2s;
}

.filter-btn:hover {
    background: var(--surface-2);
    color: var(--text);
}

.filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 18px;
}

.section-title {
    font-size: 22px;
    letter-spacing: -.7px;
}

.project-count {
    color: var(--muted);
    font-size: 12px;
}


/* =========================================================
   PROJECT GRID
========================================================= */

.project-grid {
    display: grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap: 22px;

    padding-bottom: 80px;
}


/* =========================================================
   PROJECT CARD
========================================================= */

.project-card {
    overflow: hidden;

    border: 1px solid var(--border);
    border-radius: var(--radius);

    background: var(--surface);

    box-shadow:
        0 1px 2px rgba(0,0,0,.03);

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
}

.project-card:hover {
    transform: translateY(-5px);

    box-shadow: var(--shadow);

    border-color:
        color-mix(
            in srgb,
            var(--accent) 35%,
            var(--border)
        );
}


/* PROJECT IMAGE */

.project-image {
    position: relative;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: var(--surface-2);
}

.project-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: transform .35s ease;
}

.project-card:hover .project-image img {
    transform: scale(1.025);
}

.status {
    position: absolute;

    top: 13px;
    left: 13px;

    padding: 5px 9px;

    border-radius: 999px;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 10px;
    font-weight: 700;

    backdrop-filter: blur(8px);
}


/* PROJECT CONTENT */

.project-content {
    padding: 21px;
}

.project-title {
    margin-bottom: 7px;

    font-size: 18px;

    line-height: 1.3;

    letter-spacing: -.4px;
}

.project-description {
    min-height: 47px;

    margin-bottom: 17px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.7;
}


/* TECHNOLOGY BADGES */

.technologies {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;

    margin-bottom: 20px;
}

.tech {
    padding: 5px 8px;

    border: 1px solid var(--border);
    border-radius: 6px;

    background: var(--surface-2);

    color: var(--muted);

    font-size: 10px;
    font-weight: 600;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions {
    display: flex;
    gap: 8px;
}

.btn {
    min-height: 40px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    padding: 0 13px;

    border-radius: 8px;

    font-size: 11px;
    font-weight: 700;

    transition: .18s;
}

.primary {
    flex: 1;

    background: var(--accent);
    border: 1px solid var(--accent);

    color: white;
}

.primary:hover {
    background: var(--accent-hover);
}

.secondary {
    border: 1px solid var(--border);

    background: var(--surface);
    color: var(--text);
}

.secondary:hover {
    background: var(--surface-2);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {
    display: none;

    padding: 70px 20px;

    margin-bottom: 70px;

    border: 1px dashed var(--border);
    border-radius: var(--radius);

    text-align: center;

    color: var(--muted);
}

.empty.show {
    display: block;
}

.empty h3 {
    margin-bottom: 6px;

    color: var(--text);

    font-size: 17px;
}

.empty p {
    font-size: 13px;
}


/* =========================================================
   DETAILS PAGE
========================================================= */

.details-page {
    display: none;

    padding: 45px 0 90px;
}

.details-page.active {
    display: block;
}

.library-page.hidden {
    display: none;
}

.back-btn {
    border: 0;

    background: transparent;

    color: var(--muted);

    font-size: 13px;
    font-weight: 700;

    margin-bottom: 32px;

    padding: 5px 0;

    cursor: pointer;
}

.back-btn:hover {
    color: var(--text);
}

.details-header {
    max-width: 900px;

    margin-bottom: 30px;
}

.details-label {
    margin-bottom: 10px;

    color: var(--accent);

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.details-title {
    margin-bottom: 15px;

    font-size: clamp(34px,5vw,56px);

    line-height: 1.05;

    letter-spacing: -2.5px;
}

.details-description {
    max-width: 760px;

    color: var(--muted);

    font-size: 15px;

    line-height: 1.8;
}


/* DETAILS IMAGE */

.details-preview {
    overflow: hidden;

    margin-bottom: 35px;

    border: 1px solid var(--border);
    border-radius: var(--radius);

    background: var(--surface);
}

.details-preview img {
    width: 100%;

    aspect-ratio: 16 / 7;

    object-fit: cover;
}


/* DETAILS LAYOUT */

.details-layout {
    display: grid;

    grid-template-columns:
        minmax(0,1.5fr)
        minmax(260px,.7fr);

    gap: 50px;
}

.details-main h2,
.details-sidebar h2 {
    margin-bottom: 13px;

    font-size: 17px;
}

.details-main p {
    margin-bottom: 32px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.85;
}


/* FEATURES */

.features {
    list-style: none;

    display: grid;

    gap: 11px;

    margin-bottom: 35px;
}

.features li {
    display: flex;
    align-items: center;

    gap: 10px;

    color: var(--muted);

    font-size: 14px;
}

.check {
    width: 20px;
    height: 20px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: var(--success-soft);

    color: var(--success);

    font-size: 11px;
    font-weight: 800;
}


/* SIDEBAR */

.sidebar-box {
    padding: 20px;

    margin-bottom: 15px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: var(--surface);
}

.info {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    padding: 12px 0;

    border-bottom: 1px solid var(--border);

    font-size: 13px;
}

.info:last-child {
    border-bottom: 0;
}

.info-label {
    color: var(--muted);
}

.info-value {
    text-align: right;

    font-weight: 700;
}

.detail-techs {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;

    margin-top: 5px;
}

.detail-actions {
    display: flex;

    gap: 8px;

    margin-top: 22px;
}

.detail-actions .btn {
    flex: 1;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    border-top: 1px solid var(--border);

    padding: 26px 0;

    color: var(--muted);

    font-size: 11px;
}

.footer-inner {
    max-width: var(--max-width);

    margin: auto;

    padding: 0 28px;

    display: flex;

    justify-content: space-between;

    gap: 20px;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1050px) {

    .project-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .details-layout {
        grid-template-columns: 1fr;
        gap: 25px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:720px) {

    .container {
        width:
            min(
                calc(100% - 32px),
                var(--max-width)
            );
    }

    .nav-inner {
        min-height: 64px;

        padding: 0 16px;
    }

    .nav-right {
        gap: 4px;
    }

    .nav-link {
        display: block;
        padding: 8px 7px;
        font-size: 11px;
    }

    .hero {
        padding: 48px 0 28px;
    }

    .hero h1 {
        letter-spacing: -2px;
    }

    .hero-description {
        font-size: 14px;
    }

    .toolbar {
        align-items: stretch;
    }

    .search-box {
        max-width: none;
    }

    .project-grid {
        grid-template-columns: 1fr;

        gap: 16px;
    }

    .details-title {
        letter-spacing: -1.5px;
    }

    .details-preview img {
        aspect-ratio: 16 / 9;
    }

    .footer-inner {
        padding: 0 16px;

        flex-direction: column;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:420px) {

    .brand span {
        font-size: 14px;
    }

    .hero h1 {
        font-size: 35px;
    }

    .actions {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }

    .detail-actions {
        flex-direction: column;
    }

}

</style>
</head>

            "Completed",

        github:
            "https://github.com/",

        live:
            "https://example.com/"

    }

];


/* =========================================================
   STATE
========================================================= */

let activeFilter = "All";


/* =========================================================
   GET TECHNOLOGIES
========================================================= */

function getTechnologies() {

    const technologies = new Set();

    projects.forEach(project => {

        project.technologies.forEach(technology => {

            technologies.add(technology);

        });

    });

    return [...technologies].sort();

}


/* =========================================================
   CREATE FILTERS
========================================================= */

function createFilters() {

    const container =
        document.getElementById("filterContainer");

    container.innerHTML = "";

    const filters = [
        "All",
        ...getTechnologies()
    ];


    filters.forEach(filter => {

        const button =
            document.createElement("button");

        button.className =
            "filter-btn" +
            (
                filter === activeFilter
                    ? " active"
                    : ""
            );

        button.textContent = filter;


        button.onclick = function() {

            activeFilter = filter;

            createFilters();

            renderProjects();

        };


        container.appendChild(button);

    });

}


/* =========================================================
   RENDER PROJECTS
========================================================= */

function renderProjects() {

    const grid =
        document.getElementById("projectGrid");

    const empty =
        document.getElementById("emptyState");

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        projects.filter(project => {


            const searchMatch =

                project.name
                    .toLowerCase()
                    .includes(search)

                ||

                project.description
                    .toLowerCase()
                    .includes(search)

                ||

                project.technologies.some(
                    tech =>
                        tech
                            .toLowerCase()
                            .includes(search)
                );


            const filterMatch =

                activeFilter === "All"

                ||

                project.technologies.includes(
                    activeFilter
                );


            return searchMatch && filterMatch;

        });


    grid.innerHTML = "";


    filtered.forEach(project => {


        const card =
            document.createElement("article");


        card.className =
            "project-card";


        card.innerHTML = `

            <div class="project-image">

                <img
                    src="${project.image}"
                    alt="${project.name} preview"
                    loading="lazy"
                >

                <span class="status">
                    ${project.status}
                </span>

            </div>


            <div class="project-content">

                <h3 class="project-title">
                    ${project.name}
                </h3>


                <p class="project-description">
                    ${project.description}
                </p>


                <div class="technologies">

                    ${project.technologies
                        .slice(0,5)
                        .map(
                            tech =>
                                `
                                <span class="tech">
                                    ${tech}
                                </span>
                                `
                        )
                        .join("")
                    }

                </div>


                <div class="actions">


                    <a
                        href="${project.live}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn primary"
                    >
                        Visit Project ↗
                    </a>


                    <button
                        class="btn secondary"
                        onclick="openDetails('${project.id}')"
                    >
                        Details ↗
                    </button>


                </div>

            </div>

        `;


        grid.appendChild(card);

    });


    document.getElementById("projectCount")
        .textContent =
            `${filtered.length} ${
                filtered.length === 1
                    ? "project"
                    : "projects"
            }`;


    if(filtered.length === 0) {

        empty.classList.add("show");

    } else {

        empty.classList.remove("show");

    }

}


/* =========================================================
   OPEN DETAILS
========================================================= */

function openDetails(id) {

    const project =
        projects.find(
            project =>
                project.id === id
        );


    if(!project) return;


    document
        .getElementById("libraryPage")
        .classList.add("hidden");


    document
        .getElementById("detailsPage")
        .classList.add("active");


    const content =
        document.getElementById("detailsContent");


    content.innerHTML = `

        <div class="details-header">

            <div class="details-label">
                Project Details
            </div>


            <h1 class="details-title">
                ${project.name}
            </h1>


            <p class="details-description">
                ${project.description}
            </p>

        </div>


        <div class="details-preview">

            <img
                src="${project.image}"
                alt="${project.name} preview"
            >

        </div>


        <div class="details-layout">


            <div class="details-main">


                <h2>
                    Description
                </h2>


                <p>
                    ${project.longDescription}
                </p>


                <h2>
                    Main Features
                </h2>


                <ul class="features">

                    ${project.features
                        .map(
                            feature =>
                                `
                                <li>

                                    <span class="check">
                                        ✓
                                    </span>

                                    <span>
                                        ${feature}
                                    </span>

                                </li>
                                `
                        )
                        .join("")
                    }

                </ul>


            </div>


            <aside class="details-sidebar">


                <div class="sidebar-box">

                    <h2>
                        Project Information
                    </h2>


                    <div class="info">

                        <span class="info-label">
                            Development
                        </span>

                        <span class="info-value">
                            ${project.developmentTime}
                        </span>

                    </div>


                    <div class="info">

                        <span class="info-label">
                            Status
                        </span>

                        <span class="info-value">
                            ${project.status}
                        </span>

                    </div>

                </div>


                <div class="sidebar-box">

                    <h2>
                        Technologies
                    </h2>


                    <div class="detail-techs">

                        ${project.technologies
                            .map(
                                tech =>
                                    `
                                    <span class="tech">
                                        ${tech}
                                    </span>
                                    `
                            )
                            .join("")
                        }

                    </div>


                    <div class="detail-actions">


                        <a
                            href="${project.live}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn primary"
                        >
                            Live Project ↗
                        </a>


                        <a
                            href="${project.github}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn secondary"
                        >
                            GitHub ↗
                        </a>


                    </div>

                </div>


            </aside>


        </div>

    `;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   BACK TO PROJECT LIBRARY
========================================================= */

function showLibrary() {

    document
        .getElementById("detailsPage")
        .classList.remove("active");


    document
        .getElementById("libraryPage")
        .classList.remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}




/* =========================================================
   INITIALIZE
========================================================= */

createFilters();

renderProjects();

</script>

</body>
</html>
