<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #070b12;
    --surface: #0d131c;
    --surface-2: #151d29;
    --text: #f5f7fb;
    --muted: #9aa7b8;
    --border: #253044;
    --accent: #5b8cff;
    --accent-hover: #79a2ff;
    --accent-soft: rgba(91,140,255,.14);
    --success: #4ade80;
    --success-soft: rgba(74,222,128,.12);
    --shadow: 0 18px 45px rgba(0,0,0,.35);
    --radius: 16px;
    --max-width: 1280px;
}




/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;

    transition:
        background .2s ease,
        color .2s ease;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    text-decoration: none;
    color: inherit;
}

img {
    display: block;
    width: 100%;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: min(
        calc(100% - 48px),
        var(--max-width)
    );

    margin: auto;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    padding: 28px 0 10px;
}

.hero-content {
    max-width: 850px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 6px 10px;

    margin-bottom: 18px;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: var(--surface);

    color: var(--muted);

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .6px;
}

.eyebrow-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--accent);
}

.hero h1 {
    font-size: clamp(38px,5vw,64px);

    line-height: 1.04;

    letter-spacing: -3px;

    margin-bottom: 18px;
}

.hero h1 span {
    color: var(--accent);
}

.hero-description {
    max-width: 700px;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.75;
}





/* =========================================================
   SECTION HEADER
========================================================= */




/* =========================================================
   PROJECT GRID
========================================================= */

.project-grid {
    display: grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap: 22px;

    padding-bottom: 80px;
}


/* =========================================================
   PROJECT CARD
========================================================= */

.project-card {
    overflow: hidden;

    border: 1px solid var(--border);
    border-radius: var(--radius);

    background: var(--surface);

    box-shadow:
        0 1px 2px rgba(0,0,0,.03);

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
}

.project-card:hover {
    transform: translateY(-5px);

    box-shadow: var(--shadow);

    border-color:
        color-mix(
            in srgb,
            var(--accent) 35%,
            var(--border)
        );
}


/* PROJECT IMAGE */

.project-image {
    position: relative;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: var(--surface-2);
}

.project-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: transform .35s ease;
}

.project-card:hover .project-image img {
    transform: scale(1.025);
}

.status {
    position: absolute;

    top: 13px;
    left: 13px;

    padding: 5px 9px;

    border-radius: 999px;

    background: rgba(0,0,0,.7);

    color: white;

    font-size: 10px;
    font-weight: 700;

    backdrop-filter: blur(8px);
}


/* PROJECT CONTENT */

.project-content {
    padding: 21px;
}

.project-title {
    margin-bottom: 7px;

    font-size: 18px;

    line-height: 1.3;

    letter-spacing: -.4px;
}

.project-description {
    min-height: 47px;

    margin-bottom: 17px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.7;
}


/* TECHNOLOGY BADGES */

.technologies {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;

    margin-bottom: 20px;
}

.tech {
    padding: 5px 8px;

    border: 1px solid var(--border);
    border-radius: 6px;

    background: var(--surface-2);

    color: var(--muted);

    font-size: 10px;
    font-weight: 600;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions {
    display: flex;
    gap: 8px;
}

.btn {
    min-height: 40px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    padding: 0 13px;

    border-radius: 8px;

    font-size: 11px;
    font-weight: 700;

    transition: .18s;
}

.primary {
    flex: 1;

    background: var(--accent);
    border: 1px solid var(--accent);

    color: white;
}

.primary:hover {
    background: var(--accent-hover);
}

.secondary {
    border: 1px solid var(--border);

    background: var(--surface);
    color: var(--text);
}

.secondary:hover {
    background: var(--surface-2);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {
    display: none;

    padding: 70px 20px;

    margin-bottom: 70px;

    border: 1px dashed var(--border);
    border-radius: var(--radius);

    text-align: center;

    color: var(--muted);
}

.empty.show {
    display: block;
}

.empty h3 {
    margin-bottom: 6px;

    color: var(--text);

    font-size: 17px;
}

.empty p {
    font-size: 13px;
}


/* =========================================================
   DETAILS PAGE
========================================================= */

.details-page {
    display: none;

    padding: 45px 0 90px;
}

.details-page.active {
    display: block;
}

.library-page.hidden {
    display: none;
}

.back-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    margin: 0 0 30px auto;
    padding: 13px 22px;
    min-height: 46px;

    border: 1px solid rgba(91,140,255,.5);
    border-radius: 12px;

    background:
        linear-gradient(135deg, rgba(91,140,255,.2), rgba(154,124,255,.15)),
        var(--surface);

    color: #e6edff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .1px;

    box-shadow:
        0 8px 24px rgba(0,0,0,.22),
        0 0 20px rgba(91,140,255,.1);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        box-shadow .2s ease;
}

.back-btn:hover {
    transform: translateX(-5px);
    background:
        linear-gradient(135deg, rgba(91,140,255,.27), rgba(154,124,255,.19)),
        var(--surface-2);
    border-color: rgba(125,158,255,.8);
    color: #fff;

    box-shadow:
        0 12px 30px rgba(0,0,0,.28),

.back-btn:active {
    transform: translateX(-2px) scale(.98);
}

@media (max-width: 720px) {
    .back-btn {

        margin-right: 0;

@keyframes nameReveal {
    from {

        transform: translateY(14px);
    }
    to {

        transform: translateY(0);

@keyframes gradientMove {

    100% { background-position: 200% center; }
}

@keyframes badgeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

@keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.35); opacity: 1; }

@keyframes glowMoveOne {
    from { transform: translate(-30px, 0); }
    to { transform: translate(80px, 20px); }

@keyframes glowMoveTwo {

@media (max-width: 720px) {

@media (prefers-reduced-motion: reduce) {
    .name-header *,
    .name-header::before,
    .name-header::after {
        animation: none !important;
    }
}

</style>
</head>

/* =========================================================
   RENDER PROJECTS
========================================================= */

function renderProjects() {

    const grid =
        document.getElementById("projectGrid");

    const empty =
        document.getElementById("emptyState");

    const filtered = projects;


    grid.innerHTML = "";


    filtered.forEach(project => {


        const card =
            document.createElement("article");


        card.className =
            "project-card";


        card.innerHTML = `

            <div class="project-image">

                <img
                    src="${project.image}"
                    alt="${project.name} preview"
                    loading="lazy"
                >

                <span class="status">
                    ${project.status}
                </span>

            </div>


            <div class="project-content">

                <h3 class="project-title">
                    ${project.name}
                </h3>


                <p class="project-description">
                    ${project.description}
                </p>


                <div class="technologies">

                    ${project.technologies
                        .slice(0,5)
                        .map(
                            tech =>
                                `
                                <span class="tech">
                                    ${tech}
                                </span>
                                `
                        )
                        .join("")
                    }

                </div>


                <div class="actions">


                    <a
                        href="${project.live}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn primary"
                    >
                        Visit Project ↗
                    </a>


                    <button
                        class="btn secondary"
                        onclick="openDetails('${project.id}')"
                    >
                        Details ↗
                    </button>


                </div>

            </div>

        `;


        grid.appendChild(card);

    });


    document.getElementById("projectCount")
        .textContent =
            `${filtered.length} ${
                filtered.length === 1
                    ? "project"
                    : "projects"
            }`;


    if(filtered.length === 0) {

        empty.classList.add("show");

    } else {

        empty.classList.remove("show");

    }

}
